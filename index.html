<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacturAPP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</head>
<body>

   <div id="navbar-container"></div>
    <!-- <h1 style="color: blue;">Tu APP de Facturación</h1> -->
<style>
.carousel-item {
    height: 500px;
}

.carousel-item img {
    height: 100%;
    width: 100%;
    object-fit: cover;
}
</style>

<div id="carouselPrincipal" class="carousel slide carousel-fade" data-ride="carousel" data-interval="4000">

  <!-- Indicadores -->
  <ol class="carousel-indicators">
    <li data-target="#carouselPrincipal" data-slide-to="0" class="active"></li>
    <li data-target="#carouselPrincipal" data-slide-to="1"></li>
    <li data-target="#carouselPrincipal" data-slide-to="2"></li>
  </ol>

  <!-- Slides -->
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="../Imagenes/Carrusel/1.carrusel_uno.webp" alt="Promoción 1">
      <div class="carousel-caption d-none d-md-block">
        <h3>Bienvenido a FacturApp</h3>
        <p>Gestiona tus productos de manera rápida y sencilla.</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="../Imagenes/Carrusel/2.carrusel_dos.webp" alt="Promoción 2">
      <div class="carousel-caption d-none d-md-block">
        <h3>Control de Inventario</h3>
        <p>Administra tus productos fácilmente.</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="../Imagenes/Carrusel/3.carrusel_tres.webp" alt="Promoción 3">
      <div class="carousel-caption d-none d-md-block">
        <h3>Interfaz Moderna</h3>
        <p>Diseño limpio y responsive con Bootstrap 4.</p>
      </div>
    </div>

  </div>

  <!-- Controles -->
  <a class="carousel-control-prev" href="#carouselPrincipal" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
    <span class="sr-only">Anterior</span>
  </a>

  <a class="carousel-control-next" href="#carouselPrincipal" role="button" data-slide="next">
    <span class="carousel-control-next-icon"></span>
    <span class="sr-only">Siguiente</span>
  </a>

</div>






  <script src="./js/cargarnavbar.js"></script>
</body>
</html>
